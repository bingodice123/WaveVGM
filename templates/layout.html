<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WaveVGM: {% block title %}{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <script type="module" src="https://cdn.jsdelivr.net/npm/media-chrome@4/+esm"></script>
  <script src="https://cdn.jsdelivr.net/npm/@hotwired/turbo@8/dist/turbo.es2017-umd.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css">
    <link rel="stylesheet" href="/static/styles.css">
    <meta name="referrer" content="no-referrer">
    <script src="/static/functions.js"></script>
    {% block head %}{% endblock %}
</head>
<body>
<!-- Nav centered using Gemini -->
<nav class="navbar navbar-expand-lg bg-body-tertiary rounded-pill border m-2 fixed-top">
    <div class="container-fluid row align-items-center mx-0 w-100">
        <div class="col-4 d-flex justify-content-start ps-0">
            <a class="navbar-brand mb-0" href="/" id="title-nav">WaveVGM</a>
        </div>
        <div class="col-4 d-flex justify-content-center">
            <form class="d-flex flex-grow-1 justify-content-center" role="search" action="/search" method="get">
                <div class="position-relative w-75">
                    <input type="text" aria-label="Search" name="q" class="form-control rounded-pill py-2 ps-3 pe-5"
                           placeholder="Search VGM..." value="{{ q }}" required autocomplete="off">

                    <button type="submit"
                            class="btn btn-primary rounded-pill position-absolute top-50 end-0 translate-middle-y me-2 px-3 py-1">
                        <i class="bi bi-search" style="color: white"></i>
                    </button>
                </div>

            </form>
        </div>
        <div class="col-4"></div>
    </div>
</nav>

<div class="hide-scrollbar mx-3 main-scroll">{% block body %}{% endblock %}</div>
<div class="border-top bg-body-tertiary m-0 fixed-bottom align-items-center" style="display: none" id="media-controls" data-turbo-permanent>
    <div class="container-fluid row align-items-center mx-0 w-100">
        <div class="col-4 d-flex justify-content-start align-items-center ps-0 gap-1 flex-grow-1">
            <div class="d-flex tight-blur-wrapper" style="height: 4.5rem; width: 4.5rem; --bg-image: url('https://i.imgur.com/x6GQBYz.jpeg')" id="blurred-thumbnail-img">
                <img src="https://i.imgur.com/x6GQBYz.jpeg" alt="" role="presentation" style="height: 100%; width: 100%; object-fit: contain" id="main-thumbnail-img">
            </div>
            <div class="d-flex flex-column justify-content-center">
                <h1 id="media-title" class="text-nowrap">Unknown</h1>
                <p id="media-desc" class="text-nowrap">Song &bull; Unknown</p>
            </div>
        </div>
    </div>
    <div class="d-flex col-4 justify-content-center m-0 align-items-center">
        <media-controller audio>
  <audio
    slot="media"
    src=""
    id="vgm-audio"
  ></audio>
  <media-control-bar>
    <media-play-button></media-play-button>
    <media-time-display showduration></media-time-display>
    <media-time-range></media-time-range>
    <media-mute-button></media-mute-button>
    <media-volume-range></media-volume-range>
  </media-control-bar>
</media-controller>
    </div>
    <div class="col-4"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js"></script>
</body>
</html>
