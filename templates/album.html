{% extends "layout.html" %}

{% block title %}
{{ album["game"] }}
{% endblock %}

{% block body %}
    <img src="{{ album["img_src"] }}" alt="{{ album["game"] }}">
    <h1>{{ album["game"] | replace("：", ":") }}</h1>
    <hr>
    <h1>Songs</h1>
    <hr>
    <ul>
        {% for song in songs %}
            <li>
                <button type="button" onclick="playAudio('{{ song["stream_src"] | replace("'", "＇")}}', '{{ album["img_src"] }}', '{{ song["name"] | replace("'", "＇") | replace("：", ":")}}', '{{ album["game"] | replace("'", "＇") | replace("：", ":")}}', '{{ song["id"] }}')" class="btn btn-primary">{{ song["name"] }}</button>
            </li>
        {% endfor %}
    </ul>
{% endblock %}
