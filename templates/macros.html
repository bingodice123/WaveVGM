{% macro album_card(game, img_src, year, id) %}
    <a href="/album?id={{ id }}" style="text-decoration: none">
        <div class="card flex-shrink-0" style="width: 18rem; height: 18rem">
            <div class="d-flex tight-blur-wrapper" style="height: 14rem; --bg-image: url('{{ img_src }}')">
                <img src="{{ img_src }}" class="card-img-top" alt="{{ game }}" style="height: 100%; width: 100%; object-fit: contain">
            </div>
            <div class="card-body" style="height: 6rem">
                <h5 class="card-title">{{ game }}</h5>
                <p class="card-text">Album &bull; {{ year }}</p>
            </div>
        </div>
    </a>

{% endmacro %}
